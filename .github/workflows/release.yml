name: Release

# Push a tag like v0.1.0, or run the workflow by hand with a version, to
# build the packages for every distribution and attach them to a GitHub
# Release.  A manual run creates the tag on the chosen commit itself.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to create (e.g. v0.1.0); empty = build only'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  arch:
    name: Arch Linux package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed git meson ninja pkgconf gtk4 \
            glib2 json-glib curl ffmpeg rubberband libpulse alsa-lib \
            webkitgtk-6.0 desktop-file-utils
      - uses: actions/checkout@v4
      - name: Package
        run: |
          useradd -m builder
          chown -R builder .
          su builder -c 'cd packaging/arch && makepkg -f --noconfirm'
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: packaging/arch/*.pkg.tar.*

  deb:
    name: Debian package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential \
            meson ninja-build pkgconf libgtk-4-dev libglib2.0-dev \
            libjson-glib-dev libcurl4-openssl-dev libavformat-dev \
            libavcodec-dev libavutil-dev libswresample-dev \
            librubberband-dev libpulse-dev libasound2-dev \
            libwebkitgtk-6.0-dev desktop-file-utils debhelper devscripts
      - name: Package
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist && mv ../pengu-deck_*.deb dist/
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  rpm:
    name: Fedora package
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install dependencies
        run: |
          dnf install -y gcc meson ninja-build pkgconf gtk4-devel \
            glib2-devel json-glib-devel libcurl-devel rubberband-devel \
            pulseaudio-libs-devel alsa-lib-devel webkitgtk6.0-devel \
            desktop-file-utils rpm-build git ffmpeg-free-devel
      - uses: actions/checkout@v4
      - name: Package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p ~/rpmbuild/SOURCES
          git archive --prefix=Pengu_Deck-0.1.1/ -o ~/rpmbuild/SOURCES/Pengu_Deck-0.1.1.tar.gz HEAD
          rpmbuild -bb packaging/fedora/pengu-deck.spec
          mkdir -p dist && cp ~/rpmbuild/RPMS/*/*.rpm dist/
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm

  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: pengu-deck.flatpak
          manifest-path: packaging/flatpak/io.github.deimen24.PenguDeck.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: true

  release:
    name: Publish release
    needs: [arch, deb, rpm, flatpak]
    # A manual run without a version only builds the artifacts.
    if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
      - name: List
        run: find packages -type f
      - name: Create tag and release
        run: |
          set -x
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Pengu Deck $TAG" \
              --generate-notes
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            packages/arch/* packages/deb/* packages/rpm/* \
            packages/*/*.flatpak
